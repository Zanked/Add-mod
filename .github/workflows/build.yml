
name: Unpack and build Advertising Blocks

on:
  workflow_dispatch:
  push:
    paths:
      - 'AdvertisingBlocks_GitHubReady_Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Unpack project ZIP
        run: |
          mkdir -p project
          unzip -o AdvertisingBlocks_GitHubReady_Source.zip -d project
          find project -maxdepth 3 -type f | head -100

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: project/AdvertisingBlocksReadyProject
        run: gradle build --no-daemon

      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdvertisingBlocks-mod
          path: project/AdvertisingBlocksReadyProject/build/libs/*.jar
          if-no-files-found: error
