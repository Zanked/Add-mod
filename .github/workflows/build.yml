
name: Unpack and build mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and unpack ZIP
        run: |
          set -eu
          ZIP=$(find . -maxdepth 3 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP archive not found in repository"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Found archive: $ZIP"
          mkdir -p unpacked
          unzip -o "$ZIP" -d unpacked

      - name: Locate Gradle project
        run: |
          set -eu
          BUILD_FILE=$(find unpacked -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found after extraction"
            find unpacked -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile mod
        run: gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdvertisingBlocks-mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
